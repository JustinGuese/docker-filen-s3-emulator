apiVersion: v1
kind: ConfigMap
metadata:
  name: filen-s3-emulator-config
data:
  {{- range $k, $v := .Values.env }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
  {{- if .Values.filenCli.enabled }}
  # The bundled gateway is a sidecar on loopback (see deployment.yaml).
  FILEN_ENDPOINT: {{ printf "http://127.0.0.1:%v" .Values.filenCli.port | quote }}
  {{- end }}
