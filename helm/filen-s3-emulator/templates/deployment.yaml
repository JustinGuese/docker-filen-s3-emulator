apiVersion: apps/v1
kind: Deployment
metadata:
  name: filen-s3-emulator
  labels:
    app: filen-s3-emulator
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: filen-s3-emulator
  template:
    metadata:
      labels:
        app: filen-s3-emulator
    spec:
      # Public resolvers must never be listed here: on a CoreDNS timeout the
      # glibc resolver retries the next nameserver, and a public resolver
      # answers NXDOMAIN for *.svc.cluster.local, turning a retryable
      # timeout into a hard failure. CoreDNS forwards external names
      # upstream, so it is sufficient on its own.
      dnsPolicy: ClusterFirst
      dnsConfig:
        options:
          - name: ndots
            value: "2"
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      {{- if .Values.filenCli.enabled }}
      # The Filen CLI's S3 gateway as a native sidecar: an init container with
      # restartPolicy Always starts before the app, and its startupProbe holds
      # the app back until the gateway listens. Bound to loopback, so it is
      # reachable only from this pod -- no Service in front of it.
      initContainers:
        - name: filen-cli
          image: "{{ .Values.filenCli.image.repository }}:{{ .Values.filenCli.image.tag }}"
          imagePullPolicy: {{ .Values.filenCli.image.pullPolicy }}
          restartPolicy: Always
          # The CLI reads FILEN_EMAIL / FILEN_PASSWORD itself, which keeps the
          # password out of argv. Only the keys the gateway needs, not the
          # whole Secret.
          env:
            {{- range $name := list "FILEN_EMAIL" "FILEN_PASSWORD" "S3_ACCESS_KEY_ID" "S3_SECRET_ACCESS_KEY" }}
            - name: {{ $name }}
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.secretName }}
                  key: {{ $name }}
            {{- end }}
            # Non-root with a read-only root filesystem: credentials cache and
            # runtime scratch go to emptyDirs.
            - name: FILEN_CLI_DATA_DIR
              value: /data
            - name: HOME
              value: /data
          # Same key pair as the app: the app signs its upstream requests with it.
          args:
            - "--skip-update"
            - "s3"
            - "--s3-hostname"
            - "127.0.0.1"
            - "--s3-port"
            - {{ .Values.filenCli.port | quote }}
            - "--s3-access-key-id"
            - "$(S3_ACCESS_KEY_ID)"
            - "--s3-secret-access-key"
            - "$(S3_SECRET_ACCESS_KEY)"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: filen-cli-data
              mountPath: /data
            - name: filen-cli-tmp
              mountPath: /tmp
          # exec, not tcpSocket: the kubelet dials the pod IP, and the gateway
          # listens on loopback only.
          startupProbe:
            exec:
              command: ["nc", "-z", "127.0.0.1", {{ .Values.filenCli.port | quote }}]
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            exec:
              command: ["nc", "-z", "127.0.0.1", {{ .Values.filenCli.port | quote }}]
            periodSeconds: 20
          resources:
            {{- toYaml .Values.filenCli.resources | nindent 12 }}
      {{- end }}
      containers:
        - name: filen-s3-emulator
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
          # secretRef first: later envFrom sources win, so a stale Secret
          # must never be shadowed by the ConfigMap.
          envFrom:
            - secretRef:
                name: {{ .Values.secretName }}
            - configMapRef:
                name: filen-s3-emulator-config
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: staging
              mountPath: /staging
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 24
      volumes:
        - name: tmp
          emptyDir: {}
        - name: staging
          emptyDir:
            sizeLimit: {{ .Values.staging.sizeLimit }}
        {{- if .Values.filenCli.enabled }}
        - name: filen-cli-data
          emptyDir: {}
        - name: filen-cli-tmp
          emptyDir: {}
        {{- end }}
